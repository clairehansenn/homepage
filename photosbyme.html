<!DOCTYPE html>
<html>
  
  <style>

    .everything {
    position: relative;
    width: 100%;
    max-width: 1000px;
    margin: auto;
}

.mapbackground {
    width: 100%;
    display: block;
}

.photos {
    position: absolute;
    width: 5%;
    height: auto;
    border: 5px solid white;
    box-shadow: 2px 3px 10px rgba(0,0,0,0.3);

    transition: all 0.35s ease;
    cursor: pointer;
}

    
.atl {
    top: 55%;
    left: 68%;
    transform: rotate(-8deg);
}

.atlanta {
    top: 57%;
    left: 74%;
    transform: rotate(6deg);
}

.nash {
    top: 43%;
    left: 64%;
    transform: rotate(-5deg);
}

.colorado {
    top: 28%;
    left: 32%;
    transform: rotate(9deg);
}

    .nc {
    top: 39%;
    left: 79%;
    transform: rotate(9deg);
}

    .indy {
    top: 35%;
    left: 62%;
    transform: rotate(-6deg);
}

.ohio {
    top: 29%;
    left: 69%;
    transform: rotate(7deg);
}

    
.photos:hover {
    transform: rotate(0deg) scale(5.0);
    z-index: 10;
}

.instructions {
    position: absolute;
    left: 10px;
    top: 200px;
    width: 50px;
    font-family: Times New Roman;
  color: #8765a5;
  text-align: center;
}
    
  </style>

  <body style="background-color: #e6d8f3;">

    <div class="everything">

    <img src="map.webp" class="mapbackground">

    <img src="atl.jpg" class="photos atl">
    <img src="atlanta.jpg" class="photos atlanta">
    <img src="bluebird.JPG" class="photos nash">
    <img src="colorado.jpg" class="photos colorado">
      <img src="nc.jpg" class="photos nc">
       <img src="ohio.jpg" class="photos ohio">
    <img src="indy.jpg" class="photos indy">

</div>


    <div class="instructions">
    <h2>Hover over each image to enlarge them!</h2>

      
</div>
  </body>
  
</html>
