<!DOCTYPE html>
<html>
  
  <style>

    .photo-map {
    position: relative;
    width: 100%;
    max-width: 1000px;
    margin: auto;
}

.map-background {
    width: 100%;
    display: block;
}

.map-photo {
    position: absolute;
    width: 5%;
    height: auto;
    border: 5px solid white;
    box-shadow: 2px 3px 10px rgba(0,0,0,0.3);

    transition: all 0.35s ease;
    cursor: pointer;
}

    
.atl {
    top: 55%;
    left: 68%;
    transform: rotate(-8deg);
}

.atlanta {
    top: 57%;
    left: 74%;
    transform: rotate(6deg);
}

.nash {
    top: 43%;
    left: 64%;
    transform: rotate(-5deg);
}

.colorado {
    top: 28%;
    left: 32%;
    transform: rotate(9deg);
}

    .nc {
    top: 39%;
    left: 79%;
    transform: rotate(9deg);
}

    .indy {
    top: 35%;
    left: 62%;
    transform: rotate(-6deg);
}

.ohio {
    top: 29%;
    left: 69%;
    transform: rotate(7deg);
}

    
.map-photo:hover {
    transform: rotate(0deg) scale(5.0);
    z-index: 10;
}
    
  </style>

  <body>

    <div class="photo-map">

    <img src="map.webp" class="map-background">

    <img src="atl.jpg" class="map-photo atl">
    <img src="atlanta.jpg" class="map-photo atlanta">
    <img src="bluebird.JPG" class="map-photo nash">
    <img src="colorado.jpg" class="map-photo colorado">
      <img src="nc.jpg" class="map-photo nc">
       <img src="ohio.jpg" class="map-photo ohio">
    <img src="indy.jpg" class="map-photo indy">

</div>
    
  </body>
  
</html>
