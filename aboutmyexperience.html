<!DOCTYPE html>
<html>
  
  <style>

     header img {
    width: 100%;
    height: auto;
    display: block;
}

    .album-container {
    width: 100%;
    height: 350px;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
}

.album {
    position: relative;
    width: 180px;
    height: 220px;
    transform-style: preserve-3d;
    transition: transform 1s;
}

.album img {
    position: absolute;
    width: 180px;
    height: 220px;
    object-fit: cover;
    border: 5px solid white;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

    
  </style>

  <body style="background-color: #d3dcbe;">

    <header>
  <img src="experienceheader.gif">
</header>

    <div class="album-container">

    <div class="album" id="album">

        <img src="content.JPG">
        <img src="farm.JPEG">
        <img src="farmm.JPG">

    </div>

</div>

<div class="album-buttons">
    <button onclick="rotateAlbum(-1)">Previous</button>
    <button onclick="rotateAlbum(1)">Next</button>
</div>
    
  </body>
  
</html>
